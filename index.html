
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latihan Persiapan ASAS 1 IPAS Kelas 6</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <h1>
            <span class="judul-utama">LATIHAN PERSIAPAN ASAS 1</span>
            <span class="judul-mapel">IPAS</span>
            <span class="judul-kelas">KELAS 6</span>
        </h1>

        <div class="identitas-sekolah">
            <p>SD NEGERI 1 PEJAWARAN</p>
            <p>SEMANGAT BERPRESTASI</p>
        </div>

    </header>


    <!-- KONTEN UTAMA -->
    <main class="container">

        <section class="welcome-card">

            <h2>Identitas Murid</h2>

            <p class="description">
                Pilih nama dan paket kuis sebelum memulai latihan.
            </p>

            <form id="form-identitas">

                <!-- NAMA MURID -->
                <div class="form-group">

                    <label for="nama">Nama Lengkap</label>

                    <select id="nama" required>

                        <option value="">Pilih nama murid</option>

                    </select>

                </div>


                <!-- NOMOR ABSEN OTOMATIS -->
                <div class="form-group">

                    <label for="absen">Nomor Absen</label>

                    <input
                        type="text"
                        id="absen"
                        placeholder="Otomatis mengikuti nama"
                        readonly
                    >

                </div>


                <!-- KELAS -->
                <div class="form-group">

                    <label for="kelas">Kelas</label>

                    <input
                        type="text"
                        id="kelas"
                        value="VI"
                        readonly
                    >

                </div>


                <!-- PAKET KUIS -->
                <div class="form-group">

                    <label for="paket">Pilih Paket Kuis IPAS</label>

                    <select id="paket" required>

                        <option value="">Pilih paket kuis</option>
                        <option value="paket-1">Paket 1</option>
                        <option value="paket-2">Paket 2</option>
                        <option value="paket-3">Paket 3</option>
                        <option value="paket-4">Paket 4</option>

                    </select>

                </div>


                <!-- TOMBOL MULAI -->
                <button type="submit" class="btn-primary">
                    MULAI KUIS
                </button>

            </form>

        </section>


        <!-- FOOTER -->
        <footer class="footer">

            © 2026 SD Negeri 1 Pejawaran

            <br>

            Latihan dan Simulasi ASAS IPAS Kelas VI

        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>

</body>

</html>
